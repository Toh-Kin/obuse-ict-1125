<style>
:root{
  /* 24日資料と同じ栗色ベース */
  --bg:#FBF5EA; --side:#4A2E1F; --card:#FFFDF8; --card2:#F3E8D6; --line:#D9C9B0;
  --ink:#4A2E1F; --dim:#6E4F3A; --mute:#8A6A4F; --acc:#B04E17; --coral:#B04E17; --gold:#B8860B;
  --on-acc:#fff; --field:#fff;
  --c1:#B8860B; --c2:#2F6DB5; --c3:#2E7D5B; --c4:#B8447A; --c5:#7A55B8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter','Noto Sans Bengali','Noto Sans JP',system-ui,sans-serif;
  -webkit-text-size-adjust:100%;line-height:1.7}
body[data-lang="bn"]{font-family:'Noto Sans Bengali','Inter',system-ui,sans-serif;line-height:1.85}
body[data-lang="ja"]{font-family:'Noto Sans JP','Inter',system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
.side{--ink:#FBF5EA;--dim:#E3D2B8;color:var(--ink);background:var(--side);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:flex-start;margin-bottom:18px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--coral);flex:none;margin-top:6px}
.brand small{display:block;color:var(--dim);font-size:12px;font-weight:600;letter-spacing:.02em}
.brand b{font-size:19px}
.lang{display:flex;gap:4px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:999px;padding:4px;width:max-content;margin-bottom:16px}
.lang button{border:0;background:none;border-radius:999px;padding:7px 14px;font-weight:600;color:var(--dim);min-height:38px}
.lang button.on{background:#FBF5EA;color:var(--side)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{text-align:left;border:0;background:none;color:var(--dim);padding:11px 14px;border-radius:12px;font-size:15px;line-height:1.4}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:#FBF5EA;color:var(--side);font-weight:700}
.nav .sep{height:1px;background:var(--line);margin:8px 6px}
.main{padding:34px clamp(18px,4vw,64px) 90px;max-width:1000px;width:100%}
h1{font-size:clamp(26px,4vw,38px);margin:0 0 6px;line-height:1.3}
h1:before{content:"";display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--coral);margin-right:12px;vertical-align:middle}
h2{font-size:21px;margin:30px 0 10px;padding-bottom:8px;border-bottom:2px solid var(--line)}
h3{font-size:17px;margin:18px 0 6px}
p{margin:8px 0;color:var(--dim)}
.lead{font-size:17px;color:var(--dim);max-width:760px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--dim);margin-right:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:16px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 1px 0 rgba(74,46,31,.05)}
.card h3{margin-top:0}
.boe .card{margin:12px 0}.boe .gh{margin:18px 0 6px}.boe .bl{margin:6px 0 0;padding-left:1.2em}.boe .bl li{margin:5px 0;line-height:1.7}.boe .tagc{font-size:12px;font-weight:600;background:var(--card2);color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 10px;vertical-align:middle;margin-left:6px}.boe .ictc{border-left:4px solid var(--acc)}

.card.link{cursor:pointer;transition:.15s}
.card.link:hover{border-color:var(--acc);transform:translateY(-1px)}
.time{color:var(--acc);font-weight:700;font-size:14px;letter-spacing:.03em}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--acc);background:transparent;color:var(--acc);
  border-radius:12px;padding:11px 18px;font-weight:700;text-decoration:none;min-height:46px}
.btn:hover{background:var(--acc);color:var(--on-acc)}
.btn.solid{background:var(--acc);color:var(--on-acc)}
.btn.off{border-color:var(--line);color:var(--mute);pointer-events:none;border-style:dashed}
.note{border-left:4px solid var(--gold);background:var(--card2);padding:10px 16px;border-radius:0 12px 12px 0;color:var(--dim);font-size:15px}
.big{font-size:19px;line-height:1.7}
ul.pts{padding-left:22px;margin:8px 0}
ul.pts li{margin:6px 0}
.kw dt{font-weight:700;font-size:18px;color:var(--acc);margin-top:18px}
.kw dd{margin:4px 0 0}
.draft{font-size:12px;color:var(--gold);border:1px dashed var(--gold);border-radius:6px;padding:1px 8px;margin-left:8px;vertical-align:middle}
/* form */
.form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0 8px}
.form label{display:block;font-size:14px;color:var(--dim);margin:14px 0 6px;font-weight:600}
.form label:first-child{margin-top:0}
.form select,.form input,.form textarea{width:100%;background:var(--field);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px;min-height:48px}
.form textarea{min-height:130px;resize:vertical}
.form select:focus,.form input:focus,.form textarea:focus{outline:none;border-color:var(--acc)}
.hint{font-size:13px;color:var(--mute);margin-top:6px}
.msg{margin-top:12px;min-height:24px;font-weight:600}
.msg.ok{color:var(--acc)} .msg.err{color:var(--coral)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{border:1.5px solid var(--line);background:none;border-radius:999px;padding:7px 16px;font-size:14px;font-weight:600;color:var(--dim);min-height:40px}
.chip.on{background:var(--side);color:#FBF5EA;border-color:var(--side)}
.q{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:16px 20px;margin:12px 0}
.q .who{font-size:13px;font-weight:700;color:var(--c);letter-spacing:.02em}
.q .m{font-size:20px;margin:6px 0 2px;line-height:1.65;white-space:pre-wrap}
.q .s{font-size:14px;color:var(--mute);white-space:pre-wrap;border-top:1px dashed var(--line);padding-top:6px;margin-top:6px}
.q .s b{font-weight:700;color:var(--dim);margin-right:6px;font-size:11px;letter-spacing:.08em}
.wsimg img{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#fff;display:block}
.frame{position:relative;width:100%;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;margin:12px 0}
.frame.wide{aspect-ratio:16/9}
.frame.tall{height:min(80vh,720px)}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.inl{color:var(--acc);font-weight:700;text-decoration:underline}
.nav .btn{width:max-content;border-color:#E3D2B8;color:#FBF5EA}
.nav .btn:hover{background:#FBF5EA;color:var(--side)}
.q .rx-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.rx{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px;font-size:16px;min-height:40px;line-height:1}
.rx span{font-size:14px;font-weight:700;color:var(--mute);min-width:.8em;text-align:left}
.rx:hover{border-color:var(--acc)}
.rx.mine{background:#FBE9DA;border-color:var(--acc)}
.rx.mine span{color:var(--acc)}
.rx.pop{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.18)}}
.rpl-btn{margin-left:auto;border:1.5px solid var(--line);background:none;border-radius:999px;padding:5px 14px;font-size:14px;font-weight:600;color:var(--dim);min-height:40px}
.rpl-btn:hover,.rpl-btn.on{border-color:var(--acc);color:var(--acc)}
.thread{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.rp{background:var(--card2);border-radius:12px;padding:10px 14px;margin:8px 0}
.rp .who{font-size:12px;font-weight:700;color:var(--mute)}
.rp .m{font-size:16px;margin:2px 0 0;line-height:1.6;white-space:pre-wrap}
.rp .s{font-size:13px;color:var(--mute);white-space:pre-wrap;border-top:1px dashed var(--line);padding-top:4px;margin-top:4px}
.rp .s b{font-size:10px;letter-spacing:.08em;margin-right:6px;color:var(--dim)}
.rform{display:grid;gap:8px;margin-top:10px}
.rform select,.rform textarea{width:100%;background:var(--field);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;min-height:44px}
.rform textarea{min-height:76px;resize:vertical}
.rform select:focus,.rform textarea:focus{outline:none;border-color:var(--acc)}
.rform .btn{justify-self:start;min-height:42px;padding:8px 16px}
.rform .rmsg{font-size:14px;font-weight:600;color:var(--coral)}
.empty{color:var(--mute);padding:26px 0}
.steps{display:grid;gap:12px;margin:12px 0;counter-reset:st}
.step{display:grid;grid-template-columns:44px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.step i{counter-increment:st;font-style:normal;width:40px;height:40px;border-radius:50%;background:var(--acc);color:var(--on-acc);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:18px}
.step i:before{content:counter(st)}
.step b{display:block;font-size:17px;margin-bottom:2px}
.step span{color:var(--dim)}
.gpanel{margin:14px 0}
.gpanel details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0}
.gpanel summary{cursor:pointer;padding:14px 18px;font-weight:700;font-size:17px}
.gpanel .gb{padding:0 20px 16px}
.gpanel .gb p{margin:8px 0}
.gpanel .gb p.sub{padding-left:18px}
.gpanel .gb p.hd{font-weight:700;color:var(--acc);margin-top:16px}
.btn.tg{cursor:pointer;background:transparent}
.btn.tg.on{background:var(--acc);color:var(--on-acc)}
.footer{margin-top:50px;color:var(--mute);font-size:13px}
.menubtn{display:none}
@media (max-width:820px){
  .app{display:block}
  .side{position:sticky;top:0;z-index:30;height:auto;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;overflow:visible;box-shadow:0 2px 10px rgba(0,0,0,.18)}
  .brand{margin:0;align-items:center}
  .brand small{display:none}
  .brand b{font-size:14px;line-height:1.35}
  .brand .dot{width:12px;height:12px;flex:none}
  .lang{margin:0;padding:3px;grid-column:2;grid-row:1}
  .lang button{padding:6px 10px;font-size:13px;min-height:34px}
  .menubtn{display:flex;grid-column:1/-1;align-items:center;justify-content:space-between;width:100%;min-height:44px;border:1.5px solid #E3D2B8;border-radius:12px;background:rgba(255,255,255,.08);color:#FBF5EA;font-size:15px;font-weight:700;padding:8px 14px}
  .nav{grid-column:1/-1;display:none;flex-direction:column;gap:6px;max-height:calc(100vh - 150px);overflow:auto;margin:0;padding:0}
  .nav.open{display:flex}
  .nav button{white-space:normal;text-align:left;border:1px solid rgba(255,255,255,.18);padding:12px 14px;min-height:46px;font-size:15px}
  .nav .sep{display:none}
  .main{padding:20px 16px calc(80px + env(safe-area-inset-bottom))}
  h1{font-size:26px}
  .btns .btn{min-height:46px}
}
body.sa .menubtn{display:none}
body.sa .nav{display:flex}
</style>

var WS = {"ja": {"h": "ワークシートの流れ(中学3年「太陽 地球 月の大きさや距離」)", "steps": [["自分のイメージを絵に描く", "自分が思っている太陽・地球・月の大きさや距離を、絵で描いてみます。"], ["大きさを58億分の1にする", "太陽・地球・月の実際の大きさ(直径)を58億分の1にして計算します。小数第2位を四捨五入して、小数第1位まで求めます。そのあと、身近なものに例えます。シートの例:太陽(直径1,400,000 km)→ 24.1 cm → バスケットボール。"], ["距離を58億分の1にする", "太陽〜地球、地球〜月の実際の距離も、同じように58億分の1にして計算し、身近なものに例えます。"], ["絵と計算結果を比べる", "1で描いたイメージ絵と、2・3の計算結果やモデルを比べて、思ったこと・感じたことを書きます。"], ["新たな疑問・問い", "考えて出てきた新しい疑問や問いを書きます。"]], "tip": "シートには単位の目安も載っています:1 km = 1000 m、1 m = 100 cm、1 cm = 10 mm。", "pdf": "ワークシート(原本・PDF)", "imgNote": "ワークシート(原本。画像をタップ/クリックすると大きく表示)"}, "en": {"h": "Flow of the worksheet (Grade 9: Sizes and distances of the Sun, Earth and Moon)", "steps": [["Draw your own image", "Draw the sizes and distances of the Sun, Earth and Moon as you imagine them."], ["Shrink the sizes to 1/5.8 billion", "Shrink the actual size (diameter) of the Sun, Earth and Moon to 1/5.8 billion and calculate. Round to one decimal place. Then compare with something familiar. Example on the sheet: Sun (diameter 1,400,000 km) → 24.1 cm → a basketball."], ["Shrink the distances to 1/5.8 billion", "Shrink the actual distances Sun–Earth and Earth–Moon to 1/5.8 billion in the same way, and compare with something familiar."], ["Compare your drawing with the results", "Compare the image you drew in step 1 with the calculations and models from steps 2 and 3. Write what you thought and felt."], ["New questions", "Write the new questions that came up as you thought about it."]], "tip": "The sheet also prints unit hints: 1 km = 1000 m, 1 m = 100 cm, 1 cm = 10 mm.", "pdf": "Original worksheet (PDF, Japanese)", "imgNote": "Worksheet (English translation of the Japanese original; tap or click an image to enlarge)"}, "bn": {"h": "ওয়ার্কশিটের ধাপ (নবম শ্রেণি: সূর্য, পৃথিবী ও চাঁদের আকার ও দূরত্ব)", "steps": [["নিজের ধারণা আঁকুন", "সূর্য, পৃথিবী ও চাঁদের আকার ও দূরত্ব আপনি যেমন কল্পনা করেন, তেমন ছবি এঁকে দেখান।"], ["আকারকে 580 কোটি ভাগের 1 ভাগে ছোট করুন", "সূর্য, পৃথিবী ও চাঁদের প্রকৃত আকার (ব্যাস) 580 কোটি ভাগের 1 ভাগে ছোট করে হিসাব করুন। দশমিকের পর দ্বিতীয় অঙ্ক রাউন্ড করে প্রথম অঙ্ক পর্যন্ত লিখুন। তারপর পরিচিত কোনো জিনিসের সঙ্গে তুলনা করুন। শিটের উদাহরণ: সূর্য (ব্যাস 1,400,000 কিমি) → 24.1 সেমি → বাস্কেটবল।"], ["দূরত্বকে 580 কোটি ভাগের 1 ভাগে ছোট করুন", "সূর্য থেকে পৃথিবী এবং পৃথিবী থেকে চাঁদের প্রকৃত দূরত্বও একইভাবে 580 কোটি ভাগের 1 ভাগে ছোট করে হিসাব করুন এবং পরিচিত জিনিসের সঙ্গে তুলনা করুন।"], ["ছবি ও হিসাবের ফল তুলনা করুন", "1 নম্বরে আঁকা ধারণার ছবির সঙ্গে 2 ও 3 নম্বরের হিসাব ও মডেল তুলনা করে যা মনে হলো, যা অনুভব করলেন, তা লিখুন।"], ["নতুন প্রশ্ন", "ভাবতে ভাবতে যে নতুন প্রশ্ন বা কৌতূহল জাগল, তা লিখুন।"]], "tip": "শিটে এককের সূত্রও দেওয়া আছে: 1 কিমি = 1000 মি, 1 মি = 100 সেমি, 1 সেমি = 10 মিমি।", "pdf": "মূল ওয়ার্কশিট (PDF, জাপানি)", "imgNote": "ওয়ার্কশিট (মূল জাপানি শিটের বাংলা অনুবাদ; ছবিতে ট্যাপ/ক্লিক করলে বড় হবে)"}};
var GUIDE = {"ja": {"btnOpen": "学習指導要領(抜粋)を見る", "btnClose": "学習指導要領(抜粋)を閉じる", "note": "中学校学習指導要領・同解説 理科編の該当部分の抜粋です。", "orig": "原文のドキュメントを開く", "secs": [["1. 学習指導要領 本文(第2分野 (6) 地球と宇宙)", ["ア 身近な天体とその運動に関する特徴に着目しながら、次のことを理解するとともに、それらの観察、実験などに関する技能を身に付けること。", "# (ア) 天体の動きと地球の自転・公転", "– 日周運動と自転:天体の日周運動の観察を行い、その観察記録を地球の自転と関連付けて理解すること。", "– 年周運動と公転:星座の年周運動や太陽の南中高度の変化などの観察を行い、その観察記録を地球の公転や地軸の傾きと関連付けて理解すること。", "# (イ) 太陽系と恒星", "– 太陽の様子:太陽の観察を行い、その観察記録や資料に基づいて、太陽の特徴を見いだして理解すること。", "– 惑星と恒星:観測資料などを基に、惑星と恒星などの特徴を見いだして理解するとともに、太陽系の構造について理解すること。", "– 月や金星の運動と見え方:月の観察を行い、その観察記録や資料に基づいて、月の公転と見え方を関連付けて理解すること。また、金星の観測資料などを基に、金星の公転と見え方を関連付けて理解すること。", "イ 地球と宇宙について、天体の観察、実験などを行い、その結果や資料を分析して解釈し、天体の運動と見え方についての特徴や規則性を見いだして表現すること。また、探究の過程を振り返ること。"]], ["2. 内容の取扱い(内容の (6) について)", ["「太陽の特徴」については、形、大きさ、表面の様子などを扱うこと。その際、太陽から放出された多量の光などのエネルギーによる地表への影響にも触れること。", "「惑星」については、大きさ、大気組成、表面温度、衛星の存在などを取り上げること。その際、地球には生命を支える条件が備わっていることにも触れること。「恒星」については、自ら光を放つことや太陽もその一つであることも扱うこと。その際、恒星の集団としての銀河系の存在にも触れること。「太陽系の構造」については、惑星以外の天体が存在することにも触れること。", "「月の公転と見え方」については、月の運動と満ち欠けを扱うこと。その際、日食や月食にも触れること。また、「金星の公転と見え方」については、金星の運動と満ち欠けや見かけの大きさを扱うこと。"]], ["3. 学習指導要領解説 理科編((イ) 太陽系と恒星)", ["# 太陽の様子について", "ここでは、観察記録や資料に基づいて、太陽は太陽系で最も大きいこと、自ら光を放出している天体であること、球形で自転していることを見いだして理解させることがねらいである。例えば、天体望遠鏡で太陽表面の黒点の観察を数日行い、それらの観察記録や写真、映像などの資料を基に、太陽表面の特徴を理解させる。その際、黒点の形状や動きなどの様子から、太陽は球形で自転していることを見いだして理解させることが考えられる。また、太陽から放出された多量の光や熱のエネルギーは、地球における大気の運動や生命活動に影響を与えていることにも触れる。なお、太陽の観察に当たっては、望遠鏡で直接太陽を見ることのないよう配慮する必要がある。", "# 惑星と恒星について", "ここでは、観測資料などを基に、惑星と恒星などの特徴を見いだして理解させるとともに、太陽系の構造を理解させることがねらいである。惑星の特徴については、大きさ、密度、大気組成、表面温度、衛星の存在を取り上げる。また、各惑星の特徴を理解させるためには、惑星探査機や大型望遠鏡による画像などを活用することが考えられる。惑星は大きさによって、地球を代表とするグループと木星を代表とするグループに分けられることを見いださせ、大気組成や表面温度を比較することによって地球には生命を支える条件が備わっていることにも触れる。太陽系の構造を取り上げる際に、太陽や各惑星の位置や大きさの関係をモデルとして表すことは、太陽系の構造を概観するために効果的である。さらに、太陽系には惑星以外にも、小惑星や彗星、冥王星などの天体が存在することにも触れる。恒星の特徴については、自ら光を放つこと、太陽も恒星の一つであることを理解させる。また、太陽以外の恒星を観察しそれらが点にしか見えないことや常に相互の位置関係が変わらないことから、恒星は、太陽系の天体と比べて極めて遠距離にあることに気付かせて理解させる。その際、恒星が集団をなし銀河系を構成していることにも触れる。", "# 月や金星の運動と見え方について", "ここでは、月が約1ヶ月周期で満ち欠けし、同じ時刻に見える位置が毎日移り変わっていくことを、月が地球の周りを公転していることと関連付けて理解させるとともに、金星の観測資料などから、金星の見かけの形と大きさの変化を、金星が地球の内側の軌道を公転していることと関連付けて理解させることがねらいである。月の運動と見え方については、例えば、日没直後の月の位置と形を継続的に観察し、その観察記録や写真、映像などの資料を基に、月の見え方の特徴を見いださせ、それを太陽と月の位置関係や月の運動と関連付けて考察し理解させる。また、日食や月食が月の公転運動と関わって起こる現象であることにも触れる。金星の運動と見え方については、観測資料を基に金星の見かけの形と大きさが変化することを見いださせる。その上で、例えば、地球から見える金星の形がどのように変化するかという課題を解決するため、太陽と金星の位置関係に着目してモデル実験の計画を立てて調べさせる。その後、課題に対して実験方法や考察が妥当であるか探究の過程を振り返らせることが考えられる。その際、観察者の視点(位置)を移動させ、太陽、金星、地球を俯瞰するような視点と、地球からの視点とで考えさせることが大切である。"]], ["4. 指導・見学のポイント(太陽・月・地球の「距離と大きさ」)", ["– モデル化の活用:太陽や各惑星の位置や大きさの関係をモデルとして縮尺表現することは、生徒が広大な太陽系の全体像と各天体のサイズ差・距離感を直感的に把握するために効果的とされています。", "– 視点の移動(空間的見方・考え方):「地球からの視点」と「太陽・地球・月等を俯瞰(外側から観察)する視点」を相互に行き来させることが求められています。", "– 実感を伴う比較:惑星の大きさや密度、大気組成の比較を通じて、「地球には生命を支える独自の条件が備わっている」ことを実感させることが意図されています。"]]]}, "en": {"btnOpen": "Show the curriculum guideline (extract)", "btnClose": "Hide the curriculum guideline (extract)", "note": "Extract of the relevant parts of the Japanese Course of Study for lower secondary schools and its commentary (Science). The English is an unofficial translation; please check it.", "orig": "Open the original document (Japanese)", "secs": [["1. Course of Study (text): Science Field 2, (6) Earth and Space", ["A. While focusing on the features of familiar celestial bodies and their motion, students understand the following and acquire skills for observation and experiments related to them.", "# (a) Motion of celestial bodies, and Earth's rotation and revolution", "– Daily motion and rotation: Observe the daily motion of celestial bodies and understand the records in relation to Earth's rotation.", "– Annual motion and revolution: Observe the annual motion of constellations and changes in the Sun's culmination altitude, and understand the records in relation to Earth's revolution and the tilt of its axis.", "# (b) The solar system and stars", "– The Sun: Observe the Sun and, based on the records and materials, find and understand its features.", "– Planets and stars: Based on observational data, find and understand the features of planets, stars and so on, and understand the structure of the solar system.", "– Motion and appearance of the Moon and Venus: Observe the Moon and, based on the records and materials, understand its revolution in relation to how it looks. Also, based on observational data of Venus, understand its revolution in relation to how it looks.", "B. Through observation and experiments on Earth and space, analyse and interpret the results and materials, find and express the features and regularities in the motion and appearance of celestial bodies, and reflect on the process of inquiry."]], ["2. Handling of the content (on (6))", ["On the \"features of the Sun\": deal with its shape, size and surface. Also mention the effects on the Earth's surface of the large amount of energy, such as light, released by the Sun.", "On \"planets\": take up size, atmospheric composition, surface temperature and the existence of satellites. Also mention that Earth has the conditions that support life. On \"stars\": deal with the fact that they emit light themselves and that the Sun is one of them. Also mention the Milky Way Galaxy as a group of stars. On the \"structure of the solar system\": also mention that bodies other than planets exist.", "On the \"revolution and appearance of the Moon\": deal with the Moon's motion and phases. Also mention solar and lunar eclipses. On the \"revolution and appearance of Venus\": deal with its motion, phases and apparent size."]], ["3. Commentary (Science): (b) The solar system and stars", ["# The Sun", "The aim is to have students find and understand, from observation records and materials, that the Sun is the largest body in the solar system, emits light itself, is spherical and rotates. For example, students observe sunspots on the Sun's surface with a telescope over several days and, from the records, photos and video, understand the features of the Sun's surface. From the shape and movement of the sunspots, they find that the Sun is spherical and rotating. Teachers also mention that the large amount of light and heat energy released by the Sun affects atmospheric motion and living things on Earth. When observing the Sun, take care that no one looks directly at it through a telescope.", "# Planets and stars", "The aim is to have students find and understand the features of planets and stars from observational data, and understand the structure of the solar system. For planets, take up size, density, atmospheric composition, surface temperature and satellites. Images from space probes and large telescopes can be used. Students find that planets divide by size into an Earth-type group and a Jupiter-type group, and by comparing atmosphere and surface temperature, teachers also mention that Earth has the conditions that support life. When dealing with the structure of the solar system, representing the positions and sizes of the Sun and planets as a model is effective for getting an overview. Teachers also mention that asteroids, comets, Pluto and other bodies exist besides planets. For stars, students understand that they emit light themselves and that the Sun is one of them. By observing stars other than the Sun, they notice that stars look like points and that their positions relative to one another never change, which shows that stars are extremely far away compared with bodies in the solar system. Teachers also mention that stars form groups that make up the Milky Way Galaxy.", "# Motion and appearance of the Moon and Venus", "The aim is to have students understand that the Moon waxes and wanes in a cycle of about one month and that its position at the same time shifts each day, in relation to its revolution around Earth; and, from observational data of Venus, understand the changes in its apparent shape and size in relation to its orbit inside Earth's orbit. For the Moon, for example, students observe its position and shape just after sunset over time and, from the records, photos and video, find features of how it looks, then consider them in relation to the positions of the Sun and Moon and the Moon's motion. Teachers also mention that solar and lunar eclipses occur with the Moon's revolution. For Venus, students find from data that its apparent shape and size change. Then, to solve the problem of how Venus's shape seen from Earth changes, they plan a model experiment focusing on the positional relationship of the Sun and Venus. Afterward they reflect on whether the experimental method and consideration were appropriate. It is important to have them think both from a bird's-eye view of the Sun, Venus and Earth and from Earth's viewpoint, by moving the observer's viewpoint (position)."]], ["4. Points for teaching and observation (size and distance of the Sun, Moon and Earth)", ["– Use of modelling: Representing the positions and sizes of the Sun and planets as a scale model is considered effective for students to intuitively grasp the whole of the vast solar system and the differences in size and distance between the bodies.", "– Shifting viewpoint (spatial way of seeing and thinking): Students are asked to move back and forth between \"the view from Earth\" and \"a bird's-eye view of the Sun, Earth, Moon and so on from outside\".", "– Comparison that brings real feeling: By comparing the size, density and atmospheric composition of planets, students are meant to realise that \"Earth has unique conditions that support life\"."]]]}, "bn": {"btnOpen": "পাঠ্যক্রম নির্দেশিকা (অংশ) দেখুন", "btnClose": "পাঠ্যক্রম নির্দেশিকা (অংশ) বন্ধ করুন", "note": "জাপানের নিম্ন মাধ্যমিক বিদ্যালয়ের পাঠ্যক্রম নির্দেশিকা ও তার ব্যাখ্যা (বিজ্ঞান খণ্ড)-এর প্রাসঙ্গিক অংশের সারাংশ। বাংলা অনুবাদটি অনানুষ্ঠানিক; দয়া করে যাচাই করুন।", "orig": "মূল নথি খুলুন (জাপানি)", "secs": [["1. পাঠ্যক্রম নির্দেশিকা (মূল পাঠ): দ্বিতীয় ক্ষেত্র (6) পৃথিবী ও মহাকাশ", ["ক. পরিচিত মহাকাশীয় বস্তু ও তাদের গতির বৈশিষ্ট্যের দিকে নজর দিয়ে নিচের বিষয়গুলো বোঝা এবং সেগুলোর পর্যবেক্ষণ ও পরীক্ষা-নিরীক্ষার দক্ষতা অর্জন করা।", "# (অ) মহাকাশীয় বস্তুর গতি এবং পৃথিবীর আবর্তন ও পরিক্রমণ", "– দৈনিক গতি ও আবর্তন: মহাকাশীয় বস্তুর দৈনিক গতি পর্যবেক্ষণ করে সেই পর্যবেক্ষণ-তথ্যকে পৃথিবীর আবর্তনের সঙ্গে যুক্ত করে বোঝা।", "– বার্ষিক গতি ও পরিক্রমণ: তারামণ্ডলের বার্ষিক গতি এবং মধ্যাকাশে সূর্যের উচ্চতার পরিবর্তন পর্যবেক্ষণ করে সেই তথ্যকে পৃথিবীর পরিক্রমণ ও অক্ষের হেলানোর সঙ্গে যুক্ত করে বোঝা।", "# (আ) সৌরজগৎ ও নক্ষত্র", "– সূর্যের অবস্থা: সূর্য পর্যবেক্ষণ করে সেই তথ্য ও উপকরণের ভিত্তিতে সূর্যের বৈশিষ্ট্য খুঁজে বের করে বোঝা।", "– গ্রহ ও নক্ষত্র: পর্যবেক্ষণ-তথ্যের ভিত্তিতে গ্রহ ও নক্ষত্র প্রভৃতির বৈশিষ্ট্য খুঁজে বের করে বোঝা এবং সৌরজগতের কাঠামো বোঝা।", "– চাঁদ ও শুক্র গ্রহের গতি ও দৃশ্যরূপ: চাঁদ পর্যবেক্ষণ করে সেই তথ্য ও উপকরণের ভিত্তিতে চাঁদের পরিক্রমণকে তার দৃশ্যরূপের সঙ্গে যুক্ত করে বোঝা। একইভাবে শুক্র গ্রহের পর্যবেক্ষণ-তথ্যের ভিত্তিতে তার পরিক্রমণকে দৃশ্যরূপের সঙ্গে যুক্ত করে বোঝা।", "খ. পৃথিবী ও মহাকাশ বিষয়ে মহাকাশীয় বস্তুর পর্যবেক্ষণ ও পরীক্ষা-নিরীক্ষা করে ফলাফল ও তথ্য বিশ্লেষণ ও ব্যাখ্যা করা; মহাকাশীয় বস্তুর গতি ও দৃশ্যরূপের বৈশিষ্ট্য ও নিয়ম খুঁজে বের করে প্রকাশ করা; এবং অনুসন্ধানের প্রক্রিয়া নিয়ে ভেবে দেখা।"]], ["2. বিষয়বস্তুর ব্যবহার-নির্দেশ ((6) সম্পর্কে)", ["‘সূর্যের বৈশিষ্ট্য’: আকৃতি, আকার ও পৃষ্ঠের অবস্থা নিয়ে আলোচনা করা। সে সময় সূর্য থেকে নির্গত প্রচুর আলো প্রভৃতি শক্তির কারণে ভূপৃষ্ঠে যে প্রভাব পড়ে, তাও উল্লেখ করা।", "‘গ্রহ’: আকার, বায়ুমণ্ডলের গঠন, পৃষ্ঠের তাপমাত্রা ও উপগ্রহের উপস্থিতি তুলে ধরা। সে সময় পৃথিবীতে প্রাণ ধারণের উপযোগী পরিস্থিতি রয়েছে, তাও উল্লেখ করা। ‘নক্ষত্র’: নক্ষত্র নিজে আলো দেয় এবং সূর্যও তাদের একটি—এটি আলোচনা করা; সে সময় নক্ষত্রের সমষ্টি হিসেবে ছায়াপথের অস্তিত্বও উল্লেখ করা। ‘সৌরজগতের কাঠামো’: গ্রহ ছাড়াও অন্য মহাকাশীয় বস্তু আছে, তাও উল্লেখ করা।", "‘চাঁদের পরিক্রমণ ও দৃশ্যরূপ’: চাঁদের গতি ও কলার হ্রাসবৃদ্ধি আলোচনা করা; সে সময় সূর্যগ্রহণ ও চন্দ্রগ্রহণও উল্লেখ করা। ‘শুক্র গ্রহের পরিক্রমণ ও দৃশ্যরূপ’: শুক্রের গতি, কলার হ্রাসবৃদ্ধি ও আপাত আকার আলোচনা করা।"]], ["3. ব্যাখ্যা (বিজ্ঞান খণ্ড): (আ) সৌরজগৎ ও নক্ষত্র", ["# সূর্যের অবস্থা", "উদ্দেশ্য হলো পর্যবেক্ষণ-তথ্য ও উপকরণের ভিত্তিতে শিক্ষার্থীরা খুঁজে বের করে বুঝবে যে সূর্য সৌরজগতের সবচেয়ে বড় বস্তু, নিজে আলো বিকিরণ করে, গোলাকার এবং নিজ অক্ষে ঘোরে। যেমন: কয়েকদিন ধরে দূরবিন দিয়ে সূর্যের পৃষ্ঠের কালো দাগ (সানস্পট) পর্যবেক্ষণ করে, সেই তথ্য, ছবি ও ভিডিও থেকে সূর্যপৃষ্ঠের বৈশিষ্ট্য বোঝানো। দাগের আকৃতি ও গতি দেখে সূর্য যে গোলাকার ও ঘূর্ণায়মান, তা খুঁজে নেওয়া যায়। এছাড়া সূর্য থেকে নির্গত প্রচুর আলো ও তাপশক্তি পৃথিবীর বায়ুমণ্ডলের গতি ও প্রাণের কার্যকলাপে প্রভাব ফেলে, তাও উল্লেখ করা হয়। সূর্য পর্যবেক্ষণের সময় দূরবিন দিয়ে সরাসরি সূর্যের দিকে না তাকানোর বিষয়ে সতর্ক থাকতে হবে।", "# গ্রহ ও নক্ষত্র", "উদ্দেশ্য হলো পর্যবেক্ষণ-তথ্যের ভিত্তিতে গ্রহ ও নক্ষত্র প্রভৃতির বৈশিষ্ট্য খুঁজে বের করে বোঝানো এবং সৌরজগতের কাঠামো বোঝানো। গ্রহের বৈশিষ্ট্য হিসেবে আকার, ঘনত্ব, বায়ুমণ্ডলের গঠন, পৃষ্ঠের তাপমাত্রা ও উপগ্রহের উপস্থিতি তুলে ধরা হয়। মহাকাশ অভিযানের যান ও বড় দূরবিনের ছবিও কাজে লাগানো যায়। শিক্ষার্থীরা খুঁজে পাবে যে আকার অনুযায়ী গ্রহগুলো পৃথিবীর মতো গ্রুপ এবং বৃহস্পতির মতো গ্রুপে ভাগ হয়; বায়ুমণ্ডলের গঠন ও পৃষ্ঠের তাপমাত্রা তুলনা করে পৃথিবীতে যে প্রাণ ধারণের উপযোগী পরিস্থিতি আছে, তাও উল্লেখ করা হয়। সৌরজগতের কাঠামো আলোচনায় সূর্য ও গ্রহগুলোর অবস্থান ও আকারের সম্পর্ক মডেলে দেখানো সামগ্রিক রূপ বোঝার জন্য কার্যকর। এছাড়া গ্রহ ছাড়াও গ্রহাণু, ধূমকেতু, প্লুটো প্রভৃতি বস্তু সৌরজগতে আছে, তাও উল্লেখ করা হয়। নক্ষত্রের বৈশিষ্ট্য হিসেবে বোঝানো হয় যে তারা নিজে আলো দেয় এবং সূর্যও একটি নক্ষত্র। সূর্য ছাড়া অন্য নক্ষত্র পর্যবেক্ষণ করে শিক্ষার্থীরা লক্ষ করে যে সেগুলো বিন্দুর মতো দেখায় এবং একে অপরের সাপেক্ষে অবস্থান কখনো বদলায় না; এ থেকে বোঝা যায় নক্ষত্রগুলো সৌরজগতের বস্তুর তুলনায় অত্যন্ত দূরে। সে সময় নক্ষত্ররা দল বেঁধে ছায়াপথ গঠন করে, তাও উল্লেখ করা হয়।", "# চাঁদ ও শুক্র গ্রহের গতি ও দৃশ্যরূপ", "উদ্দেশ্য হলো শিক্ষার্থীরা বুঝবে যে চাঁদ প্রায় এক মাসের চক্রে কলা বদলায় এবং একই সময়ে চাঁদ যেখানে দেখা যায় সেই অবস্থান প্রতিদিন সরে যায়—এটি চাঁদের পৃথিবীকে পরিক্রমণের সঙ্গে যুক্ত; এবং শুক্র গ্রহের পর্যবেক্ষণ-তথ্য থেকে শুক্রের আপাত আকৃতি ও আকারের পরিবর্তনকে পৃথিবীর ভেতরের কক্ষপথে তার পরিক্রমণের সঙ্গে যুক্ত করে বোঝা। চাঁদের ক্ষেত্রে যেমন: সূর্যাস্তের ঠিক পরে চাঁদের অবস্থান ও আকৃতি ধারাবাহিকভাবে পর্যবেক্ষণ করে, সেই তথ্য, ছবি ও ভিডিও থেকে চাঁদের দৃশ্যরূপের বৈশিষ্ট্য খুঁজে বের করা এবং তা সূর্য-চাঁদের অবস্থান-সম্পর্ক ও চাঁদের গতির সঙ্গে যুক্ত করে ভেবে বোঝা। সূর্যগ্রহণ ও চন্দ্রগ্রহণ যে চাঁদের পরিক্রমণের সঙ্গে সম্পর্কিত ঘটনা, তাও উল্লেখ করা হয়। শুক্রের ক্ষেত্রে পর্যবেক্ষণ-তথ্য থেকে তার আপাত আকৃতি ও আকার বদলায়, তা খুঁজে নেওয়া হয়। এরপর যেমন: পৃথিবী থেকে দেখা শুক্রের আকৃতি কীভাবে বদলায়—এই সমস্যার সমাধানে সূর্য ও শুক্রের অবস্থান-সম্পর্কের দিকে নজর দিয়ে মডেল পরীক্ষার পরিকল্পনা করে অনুসন্ধান করা হয়। তারপর পরীক্ষার পদ্ধতি ও বিবেচনা যথার্থ ছিল কি না, অনুসন্ধানের সেই প্রক্রিয়া নিয়ে ভেবে দেখা যায়। এ সময় পর্যবেক্ষকের দৃষ্টিকোণ (অবস্থান) সরিয়ে, সূর্য, শুক্র ও পৃথিবীকে ওপর থেকে দেখার দৃষ্টিকোণ এবং পৃথিবী থেকে দেখার দৃষ্টিকোণ—দুটি থেকেই ভাবানো গুরুত্বপূর্ণ।"]], ["4. পাঠদান ও পর্যবেক্ষণের মূল বিষয় (সূর্য, চাঁদ ও পৃথিবীর আকার ও দূরত্ব)", ["– মডেল ব্যবহার: সূর্য ও গ্রহগুলোর অবস্থান ও আকারের সম্পর্ককে ছোট মাপের (স্কেল) মডেলে দেখানো শিক্ষার্থীদের বিশাল সৌরজগতের সামগ্রিক রূপ এবং বস্তুগুলোর আকার ও দূরত্বের পার্থক্য সহজে অনুভব করতে সাহায্য করে বলে মনে করা হয়।", "– দৃষ্টিকোণ বদল (স্থানিক দৃষ্টিভঙ্গি): ‘পৃথিবী থেকে দেখা’ এবং ‘বাইরে থেকে সূর্য, পৃথিবী, চাঁদ ইত্যাদিকে একসঙ্গে দেখা’—এই দুই দৃষ্টিকোণের মধ্যে বারবার যাওয়া-আসা করা প্রত্যাশিত।", "– অনুভবসহ তুলনা: গ্রহের আকার, ঘনত্ব ও বায়ুমণ্ডলের গঠন তুলনা করে ‘পৃথিবীতে প্রাণ ধারণের বিশেষ পরিস্থিতি আছে’ তা অনুভব করানোই উদ্দেশ্য।"]]]}};

function gasPost(obj, cb){
  fetch(CFG.gas,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(obj)})
    .then(function(r){return r.json();}).then(function(j){cb(j);})
    .catch(function(){
      fetch(CFG.gas,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(obj)})
        .then(function(){cb({ok:true,unconfirmed:true});}).catch(function(){cb({ok:false});});
    });
}
function pull(){
  if(!CFG.gas){ if(!notes.length) { notes=DEMO.slice(); reacts={d1:{"👍":["x","y","z"],"💡":["x"]},d2:{"🤔":["y"]}}; replies=[{id:"r1",qid:"d1",name:"(sample)",text:"আমারও একই প্রশ্ন ছিল।",text_en:"I had the same question.",text_ja:"私も同じ疑問を持っていました。"}]; render(); } return; }
  fetch(CFG.gas+(CFG.gas.indexOf("?")<0?"?":"&")+"action=list&_="+Date.now())
    .then(function(r){return r.json();})
    .then(function(j){
      if(j && j.ok){
        if(Date.now()-lastAct<4000) return;   /* 自分が押した直後は、古いデータで上書きしない */
        var s=JSON.stringify([j.notes,j.replies||[],j.reacts||{}]);
        if(s!==pull.last){ pull.last=s; notes=j.notes; replies=j.replies||[]; reacts=j.reacts||{}; if(tab==="q" && !typing()) renderBoardOnly(); }
      }
    }).catch(function(){});
}
function typing(){ var a=document.activeElement; return !!a && (a.tagName==="TEXTAREA"||a.tagName==="INPUT"||a.tagName==="SELECT"); }

 effH:"期待している効果",
 eff:["経年の教育実践の蓄積と引き継ぎ","授業力・指導力の向上と、校種を超えた協働の活性化","幼保小、小中の学びのスムーズな接続","校園種ごとの教育文化や考え方の相互理解"],
 note:"※ 出典:小布施町教育委員会の説明原稿(日本語・英語)をもとに整理。ベンガル語は原稿の訳をそのまま掲載しており、内容の確認はこれからです。" },
en:{ h:"25 Nov Morning: Obuse Town Board of Education", tag:"Reference",
 lead:"Reference material on the direction of education that the Obuse Town Board of Education is aiming for, and on how ICT is used within it (organised from the Board’s presentation script).",
 aimH:"What the Board is aiming for",
 aim:["Integrated early childhood, elementary and junior high education that fosters learner agency (the ability to set one’s own goals, think for oneself and take action on one’s own initiative).","With a common research theme from preschool to junior high, each preschool and school advances its own practice."],
 whyH:"Why a “visualisation” website was created",
 why:["The Board tries to give teachers as many chances as possible to learn by observing each other’s lessons and activities (in-house training, lesson study).","In reality, it is difficult to secure enough such opportunities.","So this school year the Board created the “Obuse Town Integrated Early Childhood, Elementary and Junior High Education Website” to make each institution’s practice visible and shared."],
 siteH:"How the site is built",
 site:["A simple, top-page-only design, open only to members of the town’s preschools and schools.","It links to the overall vision and to each institution’s annual teaching or childcare plan.","The blue underlined links in each plan lead to records of practice: lesson plans, learning materials, reflections and documentation of activities."],
 exH:"What you find in it (examples)",
 ex:[["Nursery school","From the annual childcare plan, links lead to documentation of specific activities, with photos and comments."],
     ["Elementary, Grade 6 maths","The maths subject teacher prepares every unit for self-paced learning and makes it visible. In “Enlarging and Reducing Shapes” you find digital-textbook explanation videos, videos the teacher made with AI, a learning guide, and practice exercises and reflections. (Linked to the lesson you observe on the afternoon of 25 Nov.)"],
     ["Junior high, Home economics","For “Let’s Try Caring for and Mending Clothes!”, the “Lesson Design Card” (lesson plan) and the “Lesson Newsletter” by the research coordinator are shared, plus a website made by the teacher so students can learn at their own pace."]],
 ictH:"From the ICT point of view",
 ict:["Materials that support self-paced learning: digital-textbook explanation videos, teacher-made AI-assisted videos, and a “learning guide”.","The junior high teacher’s own site: the home page shows a “learning guide” with the unit roadmap, followed by Try 1–4 and an extension task. Each Try offers the task, key points and steps, a check-up quiz, a review video and videos supporting independent problem solving.","Teachers learning from each other: staff can see practice from other school levels beyond limits of time and place. ICT is used both to change lessons and to widen professional learning."],
 effH:"Expected effects",
 eff:["Accumulating practice over the years and handing it on","Better teaching skills and collaboration across school levels","Smoother transitions: early childhood → elementary → junior high","Mutual understanding of each school level’s culture and approach"],
 note:"Source: organised from the Obuse Town Board of Education’s script (Japanese and English). The Bengali is the script’s translation as provided and has not yet been checked." },
bn:{ h:"25 নভেম্বর সকাল: ওবুসে টাউন শিক্ষা বোর্ড", tag:"রেফারেন্স",
 lead:"ওবুসে টাউন শিক্ষা বোর্ড শিক্ষার যে দিকে এগোতে চায় এবং তার মধ্যে ICT-এর ব্যবহার সম্পর্কিত রেফারেন্স উপকরণ (বোর্ডের উপস্থাপনা-পাঠ থেকে সাজানো)।",
 aimH:"বোর্ডের লক্ষ্য",
 aim:["শিক্ষার্থীদের নিজের লক্ষ্য নির্ধারণ করা, নিজে চিন্তা করা এবং নিজস্ব উদ্যোগে কাজ করার সক্ষমতা (এজেন্সি) বিকাশের লক্ষ্যে প্রাক্‌-প্রাথমিক থেকে নিম্ন মাধ্যমিক পর্যন্ত সমন্বিত শিক্ষা।","অভিন্ন গবেষণা-বিষয়কে কেন্দ্র করে প্রতিটি স্কুল ও প্রাক্‌-প্রাথমিক প্রতিষ্ঠান নিজ নিজ শিক্ষাচর্চা এগিয়ে নিচ্ছে।"],
 whyH:"কেন “দৃশ্যমান করার” ওয়েবসাইট তৈরি হলো",
 why:["শিক্ষকেরা যাতে একে অপরের পাঠ ও কার্যক্রম সরাসরি দেখে শিখতে পারেন, সে জন্য বোর্ড যতটা সম্ভব সুযোগ তৈরির চেষ্টা করে (ইন-হাউস প্রশিক্ষণ, পাঠ-গবেষণা)।","বাস্তবে পর্যাপ্ত সুযোগ তৈরি করা কঠিন।","তাই চলতি শিক্ষাবর্ষে প্রতিটি প্রতিষ্ঠানের শিক্ষাচর্চা দৃশ্যমান ও ভাগ করে নেওয়ার জন্য “ওবুসে টাউন সমন্বিত প্রাক্‌-প্রাথমিক, প্রাথমিক ও নিম্ন মাধ্যমিক শিক্ষা ওয়েবসাইট” তৈরি করা হয়েছে।"],
 siteH:"সাইটের কাঠামো",
 site:["শুধু একটি মূল পৃষ্ঠা নিয়ে সহজ কাঠামো; কেবল শহরের স্কুল ও প্রাক্‌-প্রাথমিক প্রতিষ্ঠানের সদস্যদের জন্য উন্মুক্ত।","সামগ্রিক রূপরেখা এবং প্রতিটি প্রতিষ্ঠানের বার্ষিক পাঠদান বা শিশু পরিচর্যা পরিকল্পনার লিংক আছে।","পরিকল্পনার নীল আন্ডারলাইন করা লিংক থেকে পাঠ পরিকল্পনা, শিক্ষাসামগ্রী, পর্যালোচনা ও কার্যক্রমের নথি দেখা যায়।"],
 exH:"সাইটে কী আছে (উদাহরণ)",
 ex:[["প্রাক্‌-প্রাথমিক","বার্ষিক শিশু পরিচর্যা পরিকল্পনার লিংক থেকে ছবি ও মন্তব্যসহ নির্দিষ্ট কার্যক্রমের নথি দেখা যায়।"],
     ["প্রাথমিক, ষষ্ঠ শ্রেণির গণিত","গণিতের বিষয়শিক্ষক প্রতিটি পাঠ-একক নিজ গতিতে শেখার উপযোগী করে প্রস্তুত করেন ও দৃশ্যমান করেন। “জ্যামিতিক আকৃতির বড় ও ছোট করা” এককে আছে ডিজিটাল পাঠ্যবইয়ের ভিডিও, শিক্ষকের এআই-সহায়তায় তৈরি ভিডিও, শেখার নির্দেশিকা এবং অনুশীলনী ও পর্যালোচনা। (25 নভেম্বর বিকেলের পর্যবেক্ষণ ক্লাসের সঙ্গে সম্পর্কিত।)"],
     ["নিম্ন মাধ্যমিক, গার্হস্থ্য বিজ্ঞান","“চলো, পোশাকের যত্ন ও মেরামতের চেষ্টা করি!” এককে “পাঠ পরিকল্পনা কার্ড” ও “পাঠ-সংবাদ” ভাগ করা হয়েছে, সঙ্গে শিক্ষকের নিজের তৈরি ওয়েবসাইট, যাতে শিক্ষার্থীরা নিজ গতিতে শিখতে পারে।"]],
 ictH:"ICT ব্যবহারের দৃষ্টিকোণ থেকে",
 ict:["নিজ গতিতে শেখায় সহায়ক উপকরণ: ডিজিটাল পাঠ্যবইয়ের ব্যাখ্যামূলক ভিডিও, এআই-সহায়তায় শিক্ষকের তৈরি ভিডিও, “শেখার নির্দেশিকা”।","নিম্ন মাধ্যমিকের নিজস্ব সাইট: মূল পৃষ্ঠায় “শেখার নির্দেশিকা”, তারপর প্রচেষ্টা ১–৪ ও অগ্রসর কাজ। প্রতিটিতে কাজ, মূল বিষয় ও ধাপ, যাচাই পরীক্ষা, পুনরালোচনার ভিডিও এবং সমস্যা সমাধানে সহায়ক ভিডিও থাকে।","শিক্ষকদের পারস্পরিক শেখা: সময় ও স্থানের সীমা ছাড়িয়ে অন্য স্তরের শিক্ষাচর্চা দেখা যায়।"],
 effH:"প্রত্যাশিত সুফল",
 eff:["বছরের পর বছর শিক্ষাচর্চা সংরক্ষণ ও হস্তান্তর","পাঠদান দক্ষতা উন্নত করা এবং বিভিন্ন স্তরের মধ্যে সহযোগিতা বাড়ানো","প্রাক্‌-প্রাথমিক → প্রাথমিক → নিম্ন মাধ্যমিকে শেখার ধারাবাহিকতা","প্রতিটি স্তরের শিক্ষাসংস্কৃতি ও দৃষ্টিভঙ্গি সম্পর্কে পারস্পরিক বোঝাপড়া"],
 note:"সূত্র: ওবুসে টাউন শিক্ষা বোর্ডের উপস্থাপনা-পাঠ (জাপানি ও ইংরেজি) থেকে সাজানো। বাংলা অংশ পাঠের অনুবাদ থেকে নেওয়া এবং এখনো যাচাই করা হয়নি।" }

   '<h3 class="gh">'+esc(b.exH)+'</h3><div class="grid">'+b.ex.map(function(e,i){ return '<div class="card"><div class="time">'+esc(e[0])+'</div><p>'+esc(e[1])+'</p></div>'; }).join("")+'</div>'+
   '<div class="card ictc"><h3>'+esc(b.ictH)+'</h3>'+ul(b.ict)+'</div>'+
   '<div class="card"><h3>'+esc(b.effH)+'</h3><ol class="bl">'+b.eff.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ol></div>'+
   '<p class="hint">'+esc(b.note)+'</p></div>';
}

  return '<h1>'+esc(t.d24T)+'</h1><p class="lead">'+esc(t.d24Sub)+'</p><p class="big">'+esc(t.d24Body)+'</p><div class="btns">'+btn(CFG.day24,t.d24Btn,true)+'</div>'+boeHtml();

function guideHtml(G, origUrl){
  var g=G[lang], h='';
  g.secs.forEach(function(sec,k){
    h+='<details'+(k===0?' open':'')+'><summary>'+esc(sec[0])+'</summary><div class="gb">'+sec[1].map(function(x){
      if(x.indexOf("# ")===0) return '<p class="hd">'+esc(x.slice(2))+'</p>';
      if(x.indexOf("– ")===0) return '<p class="sub">'+esc(x)+'</p>';
      return '<p>'+esc(x)+'</p>'; }).join("")+'</div></details>';
  });
  return '<div class="gpanel"><p class="note">'+esc(g.note)+'</p>'+h+(origUrl&&g.orig?'<div class="btns">'+btn(origUrl,g.orig,false)+'</div>':'')+'</div>';
}
function vAM(){ var t=T(), w=WS[lang], g=GUIDE[lang];

    '<p class="hint">'+esc(w.tip)+'</p>'+
    '<div class="wsimg"><p class="hint">'+esc(w.imgNote)+'</p>'+[1,2].map(function(n){ var u='img/ws_'+lang+'_'+n+'.jpg'; return '<a href="'+u+'" target="_blank" rel="noopener"><img src="'+u+'" alt="'+esc(w.imgNote)+' '+n+'/2" loading="lazy"></a>'; }).join("")+'</div>'+
    '<h2>'+esc(t.amG)+'</h2><div class="btns"><button class="btn tg'+(guideOpen?' on':'')+'" data-gtoggle="am">'+esc(guideOpen?g.btnClose:g.btnOpen)+'</button></div>'+
    (guideOpen?guideHtml(GUIDE,CFG.sciGuideline):'');
}
var GUIDE2 = {
ja:{ btnOpen:"学習指導要領(要点)を見る", btnClose:"学習指導要領(要点)を閉じる",
 note:"小学校学習指導要領(平成29年告示)算数 第6学年「B 図形」(3)の該当部分を、要点としてまとめたものです。原文の抜粋ではなく要約です。",
 secs:[["1. 学習指導要領での位置づけ(第6学年 B 図形 (3))",["平面図形の面積に関わる数学的活動を通して、次の力を身に付けるように指導する。","# ア 知識及び技能","– 円の面積を、計算によって求める方法を理解すること。","# イ 思考力、判断力、表現力等","– 図形を構成する要素に着目して、基本的な図形の面積の求め方を見いだすこと。","– その表現を振り返り、簡潔で的確な表現に高め、公式として導くこと。"]],
  ["2. これまでの学習とのつながり(第5学年まで)",["– 第5学年で、円周の長さが「直径×円周率」で求められることを学習している。","– 第5学年で、三角形や四角形など直線で囲まれた図形の面積を学習し、「面積の公式が分かっている図形に変形して考える」考え方を繰り返し使っている。"]],
  ["3. 指導のポイント(授業づくりでよく使われる流れ)",["– 見当をつける:円の面積は、内側にぴったり入る正方形(半径×半径の2倍)より大きく、外側にぴったり重なる正方形(4倍)より小さい。方眼を数えて、およその面積も確かめる。","– 公式を導く:円を半径で細かく等分し、おうぎ形を並べ替えると、長方形に近づく。分け方を細かくするほど近づくことを確かめ、「半径×半径×円周率」の公式に表す。","– 指導案では、円周率に3.14を用いる例が多い。","– 円の一部を含む形(複合図形)や、身近な形の面積へ広げる。"]],
  ["出典",["小学校学習指導要領(平成29年告示)算数 第6学年 B(3)、および各県の指導案(埼玉県・千葉県ほか)をもとに作成。"]]] },
en:{ btnOpen:"Show the curriculum guideline (key points)", btnClose:"Hide the curriculum guideline (key points)",
 note:"Key points of the relevant part of the Japanese Course of Study for primary schools (2017), Mathematics, Grade 6, “B Geometric figures” (3). This is a summary, not a verbatim extract. The English is an unofficial translation; please check it.",
 secs:[["1. Where it sits in the Course of Study (Grade 6, B Geometric figures, (3))",["Through mathematical activities on the area of plane figures, students are taught to acquire the following.","# A. Knowledge and skills","– Understand how to find the area of a circle by calculation.","# B. Thinking, judgement and expression","– Focus on the elements of figures and find how to get the area of basic figures.","– Look back on how they expressed it, refine it into a concise and precise form, and derive it as a formula."]],
  ["2. Connection with earlier learning (up to Grade 5)",["– In Grade 5, students learned that the circumference is diameter × pi.","– In Grade 5, students learned the area of figures bounded by straight lines, such as triangles and quadrilaterals, and repeatedly used the idea of changing a figure into one whose area formula is already known."]],
  ["3. Points for teaching (a flow commonly used in lessons)",["– Estimate first: a circle’s area is larger than the square inside it (2 × radius × radius) and smaller than the square around it (4 × radius × radius). Counting squares on a grid gives the approximate area.","– Derive the formula: cut the circle finely into equal sectors along its radii and rearrange them; they approach a rectangle. Check that finer cutting gets closer, and write the formula as radius × radius × pi.","– Lesson plans often use 3.14 for pi.","– Extend to figures containing part of a circle (compound figures) and to familiar shapes."]],
  ["Sources",["Compiled from the Course of Study for primary schools (2017), Mathematics, Grade 6, B (3), and prefectural lesson plans (Saitama, Chiba and others)."]]] },
bn:{ btnOpen:"পাঠ্যক্রম নির্দেশিকা (মূল কথা) দেখুন", btnClose:"পাঠ্যক্রম নির্দেশিকা (মূল কথা) বন্ধ করুন",
 note:"জাপানের প্রাথমিক বিদ্যালয়ের পাঠ্যক্রম নির্দেশিকা (২০১৭), গণিত, ষষ্ঠ শ্রেণি, “B জ্যামিতিক আকার” (3)-এর প্রাসঙ্গিক অংশের মূল কথা। এটি সারাংশ, মূল পাঠের অংশ নয়। বাংলা অনুবাদটি অনানুষ্ঠানিক; দয়া করে যাচাই করুন।",
 secs:[["1. পাঠ্যক্রম নির্দেশিকায় অবস্থান (ষষ্ঠ শ্রেণি, B জ্যামিতিক আকার, (3))",["সমতল আকারের ক্ষেত্রফল নিয়ে গাণিতিক কার্যক্রমের মাধ্যমে শিক্ষার্থীরা নিচের বিষয়গুলো অর্জন করবে।","# ক. জ্ঞান ও দক্ষতা","– বৃত্তের ক্ষেত্রফল হিসাব করে বের করার পদ্ধতি বোঝা।","# খ. চিন্তা, বিচার ও প্রকাশ","– আকারের উপাদানের দিকে নজর দিয়ে মৌলিক আকারের ক্ষেত্রফল বের করার উপায় খুঁজে নেওয়া।","– নিজের প্রকাশ নিয়ে ফিরে ভেবে তাকে সংক্ষিপ্ত ও সঠিক রূপ দেওয়া এবং সূত্র হিসেবে দাঁড় করানো।"]],
  ["2. আগের শেখার সঙ্গে সংযোগ (পঞ্চম শ্রেণি পর্যন্ত)",["– পঞ্চম শ্রেণিতে শেখা হয়েছে যে বৃত্তের পরিধি = ব্যাস × পাই।","– পঞ্চম শ্রেণিতে ত্রিভুজ ও চতুর্ভুজের মতো সরলরেখা দিয়ে ঘেরা আকারের ক্ষেত্রফল শেখা হয়েছে এবং “যে আকারের সূত্র জানা আছে, তাতে রূপান্তর করে ভাবা” পদ্ধতি বারবার ব্যবহার করা হয়েছে।"]],
  ["3. পাঠদানের মূল কথা (পাঠ পরিকল্পনায় প্রায়ই ব্যবহৃত ধারা)",["– আগে আন্দাজ করা: বৃত্তের ক্ষেত্রফল ভেতরের বর্গের (ব্যাসার্ধ × ব্যাসার্ধ × ২) চেয়ে বড় এবং বাইরের বর্গের (× ৪) চেয়ে ছোট। গ্রিডের ঘর গুনে মোটামুটি ক্ষেত্রফলও যাচাই করা যায়।","– সূত্র বের করা: বৃত্তকে ব্যাসার্ধ বরাবর ছোট ছোট সমান বৃত্তকলায় ভাগ করে সাজালে তা আয়তক্ষেত্রের কাছাকাছি হয়। ভাগ যত সূক্ষ্ম হয়, ততই কাছাকাছি হয়—তা যাচাই করে সূত্র লেখা হয়: ব্যাসার্ধ × ব্যাসার্ধ × পাই।","– পাঠ পরিকল্পনায় পাইয়ের মান প্রায়ই 3.14 ধরা হয়।","– বৃত্তের অংশ থাকা আকার (যৌগিক আকার) এবং পরিচিত বস্তুর আকারের ক্ষেত্রফলে প্রসারিত করা।"]],
  ["সূত্র",["জাপানের প্রাথমিক বিদ্যালয়ের পাঠ্যক্রম নির্দেশিকা (২০১৭), গণিত, ষষ্ঠ শ্রেণি, B (3) এবং বিভিন্ন প্রদেশের (সাইতামা, চিবা প্রমুখ) পাঠ পরিকল্পনার ভিত্তিতে তৈরি।"]]] }
};
function vPM(){ var t=T(), g=GUIDE2[lang];
  var sl=slideLang||lang, tabs=["bn","en","ja"].map(function(l){ return '<button class="btn tg'+(sl===l?' on':'')+'" data-slang="'+l+'">'+esc(L[l].name)+'</button>'; }).join("");
  var emb=CFG.circle[sl]?CFG.circle[sl].replace("/edit?slide=","/embed?start=false&loop=false&delayms=3000&slide="):"";
  var open=["bn","en","ja"].map(function(l){ return btn(CFG.circle[l], L[l].name, false); }).join("");
  return '<h1>'+esc(t.pmT)+'</h1><p class="lead">'+esc(t.pmSub)+'</p>'+
    '<div class="grid"><div class="card"><div class="time">'+esc(t.unit)+'</div><p class="big">'+esc(t.unitV)+'</p></div>'+
    '<div class="card"><div class="time">'+esc(t.aim)+'</div><p class="big">'+esc(t.aimV)+'</p></div>'+
    '<div class="card"><div class="time">'+esc(t.view)+'</div><p class="big">'+esc(t.viewV)+'</p></div></div>'+
    '<h2>'+esc(t.slides)+'</h2><p>'+esc(t.slidesNote)+'</p><div class="btns">'+tabs+'</div>'+
    (emb?'<div class="frame wide"><iframe src="'+esc(emb)+'" allowfullscreen loading="lazy"></iframe></div>':'')+
    '<p class="hint">'+esc(t.slidesOpen)+'</p><div class="btns">'+open+'</div>'+
    '<h2>'+esc(t.pmG)+'</h2><div class="btns"><button class="btn tg'+(guideOpenPM?' on':'')+'" data-gtoggle="pm">'+esc(guideOpenPM?g.btnClose:g.btnOpen)+'</button></div>'+
    (guideOpenPM?guideHtml(GUIDE2,""):'')+
    '<h2>'+esc(t.refl)+'</h2><p>'+esc(t.reflNote)+'</p><div class="btns">'+btn(CFG.reflection,t.refl,true)+'</div>';
}
function vEve(){ var t=T();
  return '<h1>'+esc(t.eveT)+'</h1><p class="lead">'+esc(t.eveSub)+'</p>'+
    '<h2>'+esc(t.eveTalk)+'</h2><ul class="pts big">'+t.eveP.map(function(p){return '<li>'+esc(p)+'</li>';}).join("")+'</ul>'+
    '<h2>'+esc(t.eveQ)+'</h2><p class="big">'+esc(t.eveQB)+'</p><div class="btns"><button class="btn solid" data-go="q">'+esc(t.eveBtn)+'</button></div>';
}
function vKW(){ var t=T();
  return '<h1>'+esc(t.kwT)+'</h1><p class="note">'+esc(t.kwNote)+'</p><dl class="kw">'+
    t.kw.map(function(k){ return '<dt>'+esc(k.t)+'</dt><dd class="big">'+esc(k.d)+'</dd>'; }).join("")+'</dl>';
}
function vQ(){ var t=T();
  var nameField = (CFG.names&&CFG.names.length)
    ? '<select id="fName"><option value="">'+esc(t.fSel)+'</option>'+CFG.names.map(function(n){return '<option>'+esc(n)+'</option>';}).join("")+'</select>'
    : '<input id="fName" type="text" autocomplete="name">';
  var tg='<select id="fTarget"><option value="">'+esc(t.fSel)+'</option>'+TARGETS.map(function(x){return '<option value="'+x.id+'">'+esc(x[lang])+'</option>';}).join("")+'</select>';
  return '<h1>'+esc(t.qT)+'</h1><p class="lead">'+esc(t.qLead)+'</p>'+(STANDALONE||!CFG.boardPage?'':'<div class="btns"><a class="btn" href="'+esc(CFG.boardPage)+'" target="_blank" rel="noopener">'+esc(t.sep)+' ↗</a></div>')+
   '<div class="form"><label for="fName">'+esc(t.fName)+'</label>'+nameField+
   '<label for="fTarget">'+esc(t.fTarget)+'</label>'+tg+
   '<label for="fText">'+esc(t.fText)+'</label><textarea id="fText" lang="bn"></textarea><div class="hint">'+esc(t.fHint)+'</div>'+
   '<div class="btns"><button class="btn solid" id="fSend">'+esc(t.fSend)+'</button></div><div class="msg" id="fMsg"></div></div>'+
   '<h2>'+esc(t.boardT)+'</h2><p class="hint">'+esc(t.rxHint)+'</p><div class="chips" id="chips"></div><div id="board"></div><p class="hint">'+esc(t.refresh)+'</p>';
}
function pick(o,lg){   /* 日本語→日本語+小さく英語 / 英語→英語+小さくベンガル語 / ベンガル語→原文+小さく英語 */
  var main, small, sl;
  if(lg==="ja"){ main=o.text_ja||o.text; small=o.text_en; sl="EN"; }
  else if(lg==="en"){ main=o.text_en||o.text; small=o.text; sl="BN"; }
  else { main=o.text; small=o.text_en; sl="EN"; }
  if(small===main) small="";
  return {main:main, small:small, sl:sl};
}
function rxHtml(id){
  var me=cid(), r=reacts[id]||{}, t=T();
  return EMOJI.map(function(em){
    var arr=r[em]||[], mine=arr.indexOf(me)>=0;
    return '<button class="rx'+(mine?' mine':'')+'" data-rx="'+id+'|'+em+'" title="'+esc(t.rxTip[em])+'" aria-pressed="'+mine+'">'+em+'<span>'+(arr.length||"")+'</span></button>';
  }).join("");
}
function threadHtml(id){
  var t=T();
  var rs=replies.filter(function(r){ return r.qid===id; });
  var h='<div class="thread">'+rs.map(function(r){
    var p=pick(r,lang);
    return '<div class="rp"><div class="who">'+esc(r.name)+'</div><div class="m">'+esc(p.main)+'</div>'+(p.small?'<div class="s"><b>'+p.sl+'</b>'+esc(p.small)+'</div>':'')+'</div>';
  }).join("");
  var nm=(CFG.names&&CFG.names.length)
    ? '<select data-rname="'+id+'"><option value="">'+esc(t.fSel)+'</option>'+CFG.names.map(function(n){return '<option'+(n===myName?' selected':'')+'>'+esc(n)+'</option>';}).join("")+'</select>'
    : '<input data-rname="'+id+'" value="'+esc(myName)+'">';
  h+='<div class="rform">'+nm+'<textarea data-rtext="'+id+'" lang="bn" placeholder="'+esc(t.rplPh)+'">'+esc(drafts[id]||"")+'</textarea>'+
     '<button class="btn solid" data-rsend="'+id+'">'+esc(t.rplSend)+'</button><div class="rmsg" id="rm-'+id+'"></div></div></div>';
  return h;
}
function renderBoardOnly(){
  var t=T();
  var ch='<button class="chip '+(!filter?"on":"")+'" data-f="">'+esc(t.all)+'</button>'+TARGETS.map(function(x){
    return '<button class="chip '+(filter===x.id?"on":"")+'" data-f="'+x.id+'">'+esc(x[lang])+'</button>'; }).join("");
  var c=document.getElementById("chips"); if(c) c.innerHTML=ch;
  var list=notes.filter(function(n){ return !filter || n.target===filter; }).slice().reverse();
  var b=document.getElementById("board"); if(!b) return;
  if(!list.length){ b.innerHTML='<div class="empty">'+esc(t.none)+'</div>'; return; }
  b.innerHTML=list.map(function(n){
    var p=pick(n,lang), g=tgt(n.target);
    var nr=replies.filter(function(r){ return r.qid===n.id; }).length;
    return '<div class="q" style="--c:var('+g.c+')"><div class="who">'+esc(g[lang])+' · '+esc(n.name)+'</div><div class="m">'+esc(p.main)+'</div>'+
      (p.small?'<div class="s"><b>'+p.sl+'</b>'+esc(p.small)+'</div>':'')+
      '<div class="rx-row">'+rxHtml(n.id)+'<button class="rpl-btn'+(openThread[n.id]?' on':'')+'" data-rthread="'+n.id+'">💬 '+esc(t.rpl)+(nr?' · '+nr:'')+'</button></div>'+
      (openThread[n.id]?threadHtml(n.id):'')+'</div>';
  }).join("");
}

function render(){
  renderSide();
  var m=document.getElementById("main");
  var v={home:vHome,ob:vOB,d24:vD24,am:vAM,pm:vPM,eve:vEve,q:vQ,kw:vKW}[tab]||vHome;
  m.innerHTML=v();
  if(tab==="q") renderBoardOnly();
}

/* ═══════════════════ 操作 ═══════════════════ */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-l]"); if(b){ setLang(b.getAttribute("data-l")); return; }
  b=e.target.closest("[data-t]"); if(b){ go(b.getAttribute("data-t")); return; }
  b=e.target.closest("[data-go]"); if(b){ go(b.getAttribute("data-go")); return; }
  b=e.target.closest("[data-gtoggle]"); if(b){ if(b.getAttribute("data-gtoggle")==="pm") guideOpenPM=!guideOpenPM; else guideOpen=!guideOpen; render(); return; }
  b=e.target.closest("[data-slang]"); if(b){ slideLang=b.getAttribute("data-slang"); render(); return; }
  b=e.target.closest("[data-f]"); if(b){ filter=b.getAttribute("data-f"); renderBoardOnly(); return; }
  b=e.target.closest("#menuBtn"); if(b){ var nv=document.getElementById("nav"); nv.classList.toggle("open"); b.setAttribute("aria-expanded",nv.classList.contains("open")); return; }
  b=e.target.closest("[data-rx]"); if(b){ react(b); return; }
  b=e.target.closest("[data-rthread]"); if(b){ var id=b.getAttribute("data-rthread"); openThread[id]=!openThread[id]; renderBoardOnly(); return; }
  b=e.target.closest("[data-rsend]"); if(b){ sendReply(b.getAttribute("data-rsend")); return; }
  if(e.target.id==="fSend") send();
});
document.addEventListener("input",function(e){
  var id=e.target.getAttribute && e.target.getAttribute("data-rtext"); if(id) drafts[id]=e.target.value;
});
document.addEventListener("change",function(e){
  if(e.target.getAttribute && e.target.getAttribute("data-rname")!==null){ myName=e.target.value; try{localStorage.setItem("jp.name",myName);}catch(x){} }
});
function react(b){
  var a=b.getAttribute("data-rx").split("|"), id=a[0], em=a[1], me=cid();
  var r=reacts[id]=reacts[id]||{}, arr=r[em]=r[em]||[], i=arr.indexOf(me);
  if(i>=0) arr.splice(i,1); else arr.push(me);
  lastAct=Date.now(); renderBoardOnly();
  var nb=document.querySelector('[data-rx="'+id+'|'+em+'"]'); if(nb){ nb.classList.add("pop"); }
  if(CFG.gas){ gasPost({type:"react", qid:id, emoji:em, client:me}, function(){ setTimeout(function(){ lastAct=0; pull(); },900); }); }
}
function sendReply(id){
  var t=T(), box=document.querySelector('[data-rtext="'+id+'"]'), nm=document.querySelector('[data-rname="'+id+'"]'), msg=document.getElementById("rm-"+id);
  var name=(nm&&nm.value||"").trim(), text=(box&&box.value||"").trim();
  if(!name||!text){ msg.textContent=t.rplNeed; return; }
  myName=name; try{localStorage.setItem("jp.name",name);}catch(x){}
  var done=function(r){
    if(r&&r.ok){ drafts[id]=""; if(!CFG.gas){ replies.push({id:"r"+Date.now(),qid:id,name:name,text:text,text_en:"",text_ja:""}); } else { lastAct=0; setTimeout(pull,1500); } renderBoardOnly(); }
    else msg.textContent=t.rplErr;
  };
  if(!CFG.gas){ done({ok:true}); return; }
  gasPost({type:"reply", qid:id, name:name, text:text, lang:lang, client:cid()}, done);
}
function send(){
  var t=T(), msg=document.getElementById("fMsg");
  var name=(document.getElementById("fName").value||"").trim();
  var target=document.getElementById("fTarget").value;
  var text=(document.getElementById("fText").value||"").trim();
  msg.className="msg";
  if(name){ myName=name; try{localStorage.setItem("jp.name",name);}catch(e){} }
  if(!name||!target||!text){ msg.className="msg err"; msg.textContent=t.fNeed; return; }
  var btnE=document.getElementById("fSend"); btnE.disabled=true;
  var done=function(r){
    btnE.disabled=false;
    if(r && r.ok){
      msg.className="msg ok"; msg.textContent=t.fOk;
      document.getElementById("fText").value="";
      if(!CFG.gas){ notes.push({id:"l"+Date.now(),name:name,target:target,text:text,text_en:"",text_ja:""}); }
      else setTimeout(pull,1500);
      renderBoardOnly();
    } else { msg.className="msg err"; msg.textContent=t.fErr; }
  };
  if(!CFG.gas){ done({ok:true}); return; }
  gasPost({type:"q", name:name, target:target, text:text, lang:lang, client:cid()}, done);
}
function cid(){ try{ var k=localStorage.getItem("jp.cid"); if(!k){ k=Math.random().toString(36).slice(2,10); localStorage.setItem("jp.cid",k);} return k; }catch(e){ return ""; } }

document.documentElement.lang=lang; document.body.setAttribute("data-lang",lang);
render(); pull(); pollT=setInterval(pull,6000);
window.addEventListener("hashchange",function(){ if(STANDALONE) return; var t=(location.hash||"").replace("#",""); if(t && t!==tab){ tab=t; render(); } });
</script>
